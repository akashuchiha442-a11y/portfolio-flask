<html>
<head>
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='static/style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <!-- Navbar -->
 <!--<nav class="nav-links">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{ { url_for('projects')} }">Projects</a>
    <a href="{{ url_for('about') }}">About</a>
    <a href="{{ url_for('resume') }}">Resume</a>
  </nav>-->
  <nav class="navbar">
    <div class="logo">My Portfolio</div>

    <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/projects">Projects</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/resume">Resume</a></li>
    </ul>

    <div class="menu-toggle" id="mobile-menu">☰</div>
</nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <!-- Footer -->
<footer class="footer">
  <p>© 2026 My Portfolio | Built with <span class="highlight">Flask</span> & <span class="highlight">Python</span></p>
</footer>
<script>
    const menu = document.getElementById("mobile-menu");
    const navLinks = document.querySelector(".nav-links");

    menu.addEventListener("click", () => {
        navLinks.classList.toggle("active");
    });
</script>

</body>
</html>
